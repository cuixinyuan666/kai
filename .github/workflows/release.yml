name: Build Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build (e.g. v3.5.9)'
        required: true
        default: 'v3.5.9'

permissions:
  contents: write

jobs:
  apk:
    name: Generate APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set execution flag for gradlew
        run: chmod +x gradlew
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android Build Tools
        run: |
          sdkmanager "build-tools;36.0.0"
          sdkmanager "build-tools;29.0.3"
      - name: Build APK
        run: bash ./gradlew :androidApp:assembleFossRelease --stacktrace
      - name: Sign APK
        id: sign_apk
        continue-on-error: true
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: androidApp/build/outputs/apk/foss/release
          signingKeyBase64: ${{ secrets.KEYSTORE_B64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEYSTORE_PASSWORD }}
      - name: Use Gradle APK when signing unavailable
        run: |
          set -euo pipefail
          RELEASE_DIR="androidApp/build/outputs/apk/foss/release"
          SIGNED="$RELEASE_DIR/androidApp-foss-release-signed.apk"
          if [ ! -f "$SIGNED" ]; then
            cp "$RELEASE_DIR/androidApp-foss-release.apk" "$SIGNED"
          fi
          ls -la "$RELEASE_DIR"
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: signed-apk
          path: androidApp/build/outputs/apk/foss/release/androidApp-foss-release-signed.apk

  release:
    name: Release Android APK
    needs: [apk]
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Download APK Artifact
        uses: actions/download-artifact@v4.1.7
        with:
          name: signed-apk

      - name: Rename APK
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          shopt -s nullglob
          if [ -f "Kai-${VERSION}-android.apk" ]; then
            echo "Already present: Kai-${VERSION}-android.apk"
          else
            src=""
            for candidate in androidApp-foss-release-signed.apk *.apk; do
              if [ -f "$candidate" ]; then
                src="$candidate"
                break
              fi
            done
            if [ -z "$src" ]; then
              echo "ERROR: no APK artifact found"
              ls -la
              exit 1
            fi
            mv "$src" "Kai-${VERSION}-android.apk"
            echo "Moved $src -> Kai-${VERSION}-android.apk"
          fi
          ls -la Kai-*-android.apk

      - name: Extract changelog
        run: |
          VERSION="${RELEASE_TAG#v}"
          if [ -f CHANGELOG.md ]; then
            sed -n "/^## v${VERSION}/,/^## v/{ /^## v${VERSION}/d; /^## v/d; p; }" CHANGELOG.md > changelog.txt
          fi
          if [ ! -s changelog.txt ]; then
            PREVIOUS_TAG=$(git tag --sort=-creatordate | grep -v "^${RELEASE_TAG}$" | head -n1)
            if [ -n "$PREVIOUS_TAG" ]; then
              git log --pretty=format:"- %s" "${PREVIOUS_TAG}..${RELEASE_TAG}" > changelog.txt
            else
              echo "Release ${RELEASE_TAG}" > changelog.txt
            fi
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Kai ${{ env.RELEASE_TAG }}
          body_path: changelog.txt
          files: |
            Kai-*-android.apk
          draft: false
          prerelease: false
          generate_release_notes: true
