name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build (e.g. v3.4.0)'
        required: true
        default: 'v3.4.0'

permissions:
  contents: write

jobs:
  windows-zip:
    name: Generate Windows Zip
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build application distribution
        run: ./gradlew createReleaseDistributable --stacktrace
      - name: Create zip archive
        shell: pwsh
        run: |
          $version = "${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}".TrimStart('v')
          $source = "composeApp/build/compose/binaries/main-release/app/Kai"
          $dest = "Kai-${version}-windows.zip"
          Compress-Archive -Path "$source/*" -DestinationPath $dest -Force
      - name: Upload Windows Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip-package
          path: Kai-*-windows.zip

  release:
    name: Release Windows Zip
    needs: [windows-zip]
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Download Windows Zip Artifact
        uses: actions/download-artifact@v4.1.7
        with:
          name: windows-zip-package

      - name: List downloaded files (for debugging)
        run: ls -la

      - name: Rename assets
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          shopt -s nullglob
          move_to() {
            local dest="$1"
            shift
            if [ -e "$dest" ]; then
              echo "Already present: $dest"
              return 0
            fi
            local src
            for src in "$@"; do
              if [ -f "$src" ]; then
                mv "$src" "$dest"
                echo "Moved $src -> $dest"
                return 0
              fi
            done
            echo "ERROR: no source for $dest (tried: $*)"
            ls -la
            return 1
          }
          move_to "Kai-${VERSION}-windows.zip" *-windows.zip
          ls -la Kai-*

      - name: Extract changelog
        run: |
          VERSION="${RELEASE_TAG#v}"
          if [ -f CHANGELOG.md ]; then
            sed -n "/^## v${VERSION}/,/^## v/{ /^## v${VERSION}/d; /^## v/d; p; }" CHANGELOG.md > changelog.txt
          fi
          if [ ! -s changelog.txt ]; then
            PREVIOUS_TAG=$(git tag --sort=-creatordate | grep -v "^${RELEASE_TAG}$" | head -n1)
            if [ -n "$PREVIOUS_TAG" ]; then
              git log --pretty=format:"- %s" "${PREVIOUS_TAG}..${RELEASE_TAG}" > changelog.txt
            else
              echo "Release ${RELEASE_TAG}" > changelog.txt
            fi
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Kai ${{ env.RELEASE_TAG }}
          body_path: changelog.txt
          files: |
            Kai-*-windows.zip
          draft: false
          prerelease: false
          generate_release_notes: true
